<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 29.4 23.9">
  <!-- de Havilland Tiger Moth DH.82A top-down biplane silhouette -->
  <!-- Prop arc -->
  <circle cx="14.7" cy="3.75" r="3.75" fill="none" stroke="#999999" stroke-width="0.3" stroke-dasharray="1.2,0.6"/>
  <!-- Fuselage -->
  <path d="M 14.7,0 C 15.3,2 15.6,5.5 15.6,9.5 L 15.4,23.9 L 14.0,23.9 L 13.8,9.5 C 13.8,5.5 14.1,2 14.7,0 Z" fill="#4a4a4a"/>
  <!-- Upper wing (swept, staggered) -->
  <polygon points="15.6,8 29.4,11 29.4,14 15.6,14" fill="#5e5e5e"/>
  <polygon points="13.8,8 0,11 0,14 13.8,14" fill="#5e5e5e"/>
  <!-- Lower wing -->
  <polygon points="15.6,9.5 27,12 27,14.5 15.6,14.5" fill="#6e6e6e" opacity="0.7"/>
  <polygon points="13.8,9.5 2,12 2,14.5 13.8,14.5" fill="#6e6e6e" opacity="0.7"/>
  <!-- Horizontal stabilizers -->
  <polygon points="15.4,19 22,20.5 22,22.5 15.4,22" fill="#6a6a6a"/>
  <polygon points="14.0,19 7,20.5 7,22.5 14.0,22" fill="#6a6a6a"/>
</svg>
