  <polygon points="25.2,14 0,18 0,22 25.2,22.5" fill="#5e5e5e"/>
  <!-- Horizontal stabilizers -->
  <polygon points="28.8,32.5 42,34.5 42,37.5 28.8,37" fill="#6a6a6a"/>
  <polygon points="25.2,32.5 12,34.5 12,37.5 25.2,37" fill="#6a6a6a"/>
