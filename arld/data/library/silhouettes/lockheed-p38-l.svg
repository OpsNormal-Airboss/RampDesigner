<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 37.9">
  <!-- P-38L Lightning top-down silhouette (twin-boom) -->
  <!-- Left prop arc -->
  <circle cx="14" cy="5.75" r="5.75" fill="none" stroke="#999999" stroke-width="0.35" stroke-dasharray="1.7,0.85"/>
  <!-- Right prop arc -->
  <circle cx="38" cy="5.75" r="5.75" fill="none" stroke="#999999" stroke-width="0.35" stroke-dasharray="1.7,0.85"/>
  <!-- Left boom -->
  <path d="M 12.5,0 C 13.1,3 13.5,8 13.5,13 L 13.3,37.9 L 11.7,37.9 L 11.5,13 C 11.5,8 11.9,3 12.5,0 Z" fill="#4a4a4a"/>
  <!-- Right boom -->
  <path d="M 39.5,0 C 40.1,3 40.5,8 40.5,13 L 40.3,37.9 L 38.7,37.9 L 38.5,13 C 38.5,8 38.9,3 39.5,0 Z" fill="#4a4a4a"/>
  <!-- Center nacelle (pilot pod) -->
  <ellipse cx="26" cy="18" rx="2.5" ry="6" fill="#3a3a3a"/>
  <!-- Wings (straight taper) -->
  <polygon points="40.5,13 52,17 52,21 40.5,20" fill="#5e5e5e"/>
  <polygon points="11.5,13 0,17 0,21 11.5,20" fill="#5e5e5e"/>
  <!-- Center wing connecting nacelle to booms -->
  <rect x="11.5" y="15" width="29" height="5" fill="#5e5e5e"/>
  <!-- Twin horizontal stabilizers -->
  <polygon points="13.3,30 20,31.5 20,34.5 13.3,34" fill="#6a6a6a"/>
  <polygon points="11.7,30 5,31.5 5,34.5 11.7,34" fill="#6a6a6a"/>
  <polygon points="40.3,30 47,31.5 47,34.5 40.3,34" fill="#6a6a6a"/>
  <polygon points="38.7,30 32,31.5 32,34.5 38.7,34" fill="#6a6a6a"/>
</svg>
