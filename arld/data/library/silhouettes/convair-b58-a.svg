<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56.8 96.8">
  <!-- B-58A Hustler top-down silhouette (thin delta wing) -->
  <!-- Fuselage (slender needle) -->
  <path d="M 28.4,0 C 29.0,6 29.4,15 29.6,25 L 29.6,96.8 L 27.2,96.8 L 27.2,25 C 27.4,15 27.8,6 28.4,0 Z" fill="#3a3a3a"/>
  <!-- Weapons pod (under fuselage) -->
  <rect x="27" y="40" width="2.8" height="30" rx="1" fill="#5a5a5a"/>
  <!-- Delta wings -->
  <polygon points="29.6,18 56.8,65 56.8,72 29.6,45" fill="#4a4a4a"/>
  <polygon points="27.2,18 0,65 0,72 27.2,45" fill="#4a4a4a"/>
  <!-- Engine nacelles (4, under delta wing) -->
  <rect x="33" y="34" width="3.5" height="14" rx="1" fill="#6a6a6a"/>
  <rect x="38" y="40" width="3.5" height="14" rx="1" fill="#6a6a6a"/>
  <rect x="20" y="34" width="3.5" height="14" rx="1" fill="#6a6a6a"/>
  <rect x="15" y="40" width="3.5" height="14" rx="1" fill="#6a6a6a"/>
</svg>
