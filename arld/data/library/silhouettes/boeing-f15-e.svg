<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42.8 63.8">
  <!-- F-15E Strike Eagle top-down silhouette -->
  <!-- Fuselage -->
  <rect x="19.15" y="3" width="4.5" height="57.8" rx="2" fill="#4a4a4a"/>
  <!-- Wings -->
  <polygon points="21.4,18 42.8,34 42.8,38 21.4,26" fill="#5e5e5e"/>
  <polygon points="21.4,18 0,34 0,38 21.4,26" fill="#5e5e5e"/>
  <!-- Horizontal stabilizers -->
  <polygon points="21.4,48 36,52 36,56 21.4,54" fill="#6a6a6a"/>
  <polygon points="21.4,48 7,52 7,56 21.4,54" fill="#6a6a6a"/>
  <!-- Twin tails -->
  <rect x="19" y="44" width="2.5" height="16" rx="1" fill="#3a3a3a"/>
  <rect x="21.3" y="44" width="2.5" height="16" rx="1" fill="#3a3a3a"/>
</svg>
