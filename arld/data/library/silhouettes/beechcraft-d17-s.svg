<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 26.4">
  <!-- Beechcraft Staggerwing D17S top-down silhouette (negative stagger biplane) -->
  <!-- Prop arc -->
  <circle cx="16" cy="3.75" r="3.75" fill="none" stroke="#999999" stroke-width="0.3" stroke-dasharray="1.2,0.6"/>
  <!-- Fuselage -->
  <path d="M 16,0 C 16.7,2.5 17,6 17,10 L 16.8,26.4 L 15.2,26.4 L 15.0,10 C 15.0,6 15.3,2.5 16,0 Z" fill="#4a4a4a"/>
  <!-- Upper wing (staggered back) -->
  <polygon points="17,10 32,13 32,16 17,16" fill="#5e5e5e"/>
  <polygon points="15,10 0,13 0,16 15,16" fill="#5e5e5e"/>
  <!-- Lower wing (further forward) -->
  <polygon points="17,8 30,10.5 30,13 17,13" fill="#6e6e6e" opacity="0.7"/>
  <polygon points="15,8 2,10.5 2,13 15,13" fill="#6e6e6e" opacity="0.7"/>
  <!-- Horizontal stabilizers -->
  <polygon points="16.8,21 24,22.5 24,25 16.8,24.5" fill="#6a6a6a"/>
  <polygon points="15.0,21 8,22.5 8,25 15.0,24.5" fill="#6a6a6a"/>
</svg>
