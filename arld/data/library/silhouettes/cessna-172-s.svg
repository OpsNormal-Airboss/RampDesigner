<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 27.2">
  <!-- Cessna 172S Skyhawk top-down silhouette -->
  <!-- Prop arc -->
  <circle cx="18" cy="3.1" r="3.1" fill="none" stroke="#999999" stroke-width="0.25" stroke-dasharray="1.0,0.5"/>
  <!-- Fuselage -->
  <path d="M 18,0 C 18.6,2.5 18.9,6 18.9,10 L 18.7,27.2 L 17.3,27.2 L 17.1,10 C 17.1,6 17.4,2.5 18,0 Z" fill="#4a4a4a"/>
  <!-- High wing (straight) -->
  <polygon points="18.9,9 36,12 36,15 18.9,15" fill="#5e5e5e"/>
  <polygon points="17.1,9 0,12 0,15 17.1,15" fill="#5e5e5e"/>
  <!-- Horizontal stabilizers -->
  <polygon points="18.7,21.5 27,23 27,25.5 18.7,25" fill="#6a6a6a"/>
  <polygon points="17.1,21.5 9,23 9,25.5 17.1,25" fill="#6a6a6a"/>
</svg>
