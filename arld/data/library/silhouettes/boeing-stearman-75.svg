<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32.2 24.9">
  <!-- Boeing Stearman 75 Kaydet top-down biplane silhouette -->
  <!-- Prop arc -->
  <circle cx="16.1" cy="4.25" r="4.25" fill="none" stroke="#999999" stroke-width="0.3" stroke-dasharray="1.3,0.65"/>
  <!-- Fuselage -->
  <path d="M 16.1,0 C 16.8,2.5 17.1,6.5 17.1,10.5 L 16.9,24.9 L 15.3,24.9 L 15.1,10.5 C 15.1,6.5 15.4,2.5 16.1,0 Z" fill="#4a4a4a"/>
  <!-- Upper wing -->
  <polygon points="17.1,9 32.2,12 32.2,15 17.1,15" fill="#5e5e5e"/>
  <polygon points="15.1,9 0,12 0,15 15.1,15" fill="#5e5e5e"/>
  <!-- Lower wing (slightly staggered, smaller) -->
  <polygon points="17.1,10.5 30,13 30,15.5 17.1,15.5" fill="#6e6e6e" opacity="0.7"/>
  <polygon points="15.1,10.5 2,13 2,15.5 15.1,15.5" fill="#6e6e6e" opacity="0.7"/>
  <!-- Horizontal stabilizers -->
  <polygon points="16.9,20 24,21.5 24,23.5 16.9,23" fill="#6a6a6a"/>
  <polygon points="15.1,20 8,21.5 8,23.5 15.1,23" fill="#6a6a6a"/>
</svg>
