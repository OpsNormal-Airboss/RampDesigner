<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34.4 29">
  <!-- Fw 190A-8 top-down silhouette -->
  <!-- Prop arc (radial engine, large diameter) -->
  <circle cx="17.2" cy="4.9" r="4.9" fill="none" stroke="#999999" stroke-width="0.3" stroke-dasharray="1.5,0.75"/>
  <!-- Fuselage (short, round) -->
  <path d="M 17.2,0 C 18.1,3 18.5,7.5 18.5,12 L 18.3,29 L 16.1,29 L 15.9,12 C 15.9,7.5 16.3,3 17.2,0 Z" fill="#4a4a4a"/>
  <!-- Wings -->
  <polygon points="18.5,11 34.4,14.5 34.4,18 18.5,18" fill="#5e5e5e"/>
  <polygon points="15.9,11 0,14.5 0,18 15.9,18" fill="#5e5e5e"/>
  <!-- Horizontal stabilizers -->
  <polygon points="18.3,23 27,24.5 27,27 18.3,26.5" fill="#6a6a6a"/>
  <polygon points="15.9,23 7,24.5 7,27 15.9,26.5" fill="#6a6a6a"/>
</svg>
