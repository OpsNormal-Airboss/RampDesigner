name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            preset: mac-release
          - os: ubuntu-22.04
            preset: linux-release
          - os: windows-2022
            preset: win-release

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-13 g++-13 \
            libgl1-mesa-dev libglu1-mesa-dev \
            autoconf automake libtool
          echo "CC=gcc-13"  >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja autoconf automake libtool

      # Qt 6.7 installed via pre-built binaries for CI performance.
      # qtsvg / qtsvgwidgets are included in the Qt 6.7 base desktop install
      # and must NOT be listed as extra modules — aqt will error if they are.
      # vcpkg handles CGAL, nlohmann-json, and Catch2.
      - name: Install Qt 6.7
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          cache: true

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  package:
    name: Package (${{ matrix.os }})
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            preset: mac-release
            build_dir: mac-release
          - os: ubuntu-22.04
            preset: linux-release
            build_dir: linux-release
          - os: windows-2022
            preset: win-release
            build_dir: win-release

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-13 g++-13 \
            libgl1-mesa-dev libglu1-mesa-dev \
            autoconf automake libtool
          echo "CC=gcc-13"  >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja autoconf automake libtool

      - name: Install Qt 6.7
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          cache: true

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Package
        run: |
          cd build/${{ matrix.build_dir }}
          cpack

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arld-${{ matrix.os }}-${{ github.ref_name }}
          path: |
            build/**/*.dmg
            build/**/*.AppImage
            build/**/*.deb
            build/**/*.exe
            build/**/*.msi

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/**

  lint:
    name: clang-tidy
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-13 g++-13 clang clang-tidy \
            libgl1-mesa-dev libglu1-mesa-dev \
            autoconf automake libtool
          echo "CC=gcc-13"  >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Install Qt 6.7
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          cache: true

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure (generate compile_commands.json)
        run: cmake --preset linux-release

      - name: Build (populate compile_commands.json fully)
        run: cmake --build --preset linux-release

      - name: Run clang-tidy
        run: |
          find arld/core/src arld/export/src arld/ui/src arld/app \
            -name '*.cpp' | sort | \
          xargs clang-tidy \
            -p build/linux-release \
            --config-file=.clang-tidy

  license-check:
    name: License Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run license checker
        run: python3 scripts/check-licenses.py

      - name: Upload LICENSES.txt
        uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: LICENSES.txt
